<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet">
<style>
:root{--bg:#F7FAF2;--surf:#EEF2E8;--surf2:#E5EADF;--on:#1A1C18;--on2:#43483F;--sec:#D4E8CF;--pri:#3B6939;--outline:#C3C8BC}
body{margin:0;background:#dfe3da;font-family:Roboto,sans-serif;color:var(--on);padding:28px}
h1{font-size:22px;margin:0 0 4px}.sub{color:#555;margin:0 0 22px;font-size:14px}
.row{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.col{width:360px}.col h2{font-size:17px;margin:0 0 4px}.col p{font-size:13px;color:#444;margin:0 0 10px;min-height:52px;line-height:1.35}
.phone{width:360px;height:760px;background:var(--bg);border-radius:28px;overflow:hidden;position:relative;box-shadow:0 2px 14px #0002;border:6px solid #222}
.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-variation-settings:'FILL' 0}
.fill{font-variation-settings:'FILL' 1}
.status{height:24px;display:flex;justify-content:space-between;padding:4px 18px 0;font-size:12px;color:var(--on2)}
.top{display:flex;align-items:center;padding:8px 16px 4px;gap:8px}.top .t{font-size:22px;flex:1}
.top .ms{color:var(--on2)}
.seg{display:flex;margin:6px 16px 8px;border:1px solid var(--outline);border-radius:20px;overflow:hidden;height:36px}
.seg div{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;color:var(--on2)}
.seg .on{background:var(--sec);color:var(--on)}
.chips{display:flex;gap:8px;padding:0 16px 10px;align-items:center}
.chip{height:32px;border:1px solid var(--outline);border-radius:8px;padding:0 12px;display:flex;align-items:center;gap:4px;font-size:13px;color:var(--on2);white-space:nowrap}
.chip.on{background:var(--sec);border-color:var(--sec);color:var(--on)}
.chip .ms{font-size:18px}.chip.manage{margin-left:auto;border:none;color:var(--pri);font-weight:500;padding:0 4px}
.lbl{font-size:12px;color:var(--on2);padding:2px 16px 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
.tile{aspect-ratio:1;border-radius:12px;position:relative;overflow:hidden;color:#fff;font-size:11px;font-weight:500;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}
.tile b{position:absolute;top:6px;right:6px;background:#fff;color:#111;border-radius:10px;font-size:10px;padding:1px 6px}
.tile .k{position:absolute;top:6px;left:6px;font-size:16px}
.fab{position:absolute;right:16px;background:var(--sec);border-radius:16px;height:52px;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;box-shadow:0 2px 6px #0003}
.mini{position:absolute;left:8px;right:8px;height:56px;background:var(--surf2);border-radius:12px;display:flex;align-items:center;gap:10px;padding:0 8px;box-sizing:border-box}
.mini .art{width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,#7a4fd1,#d14f8a)}
.mini .tx{flex:1;font-size:13px;line-height:1.2}.mini .tx small{color:var(--on2);font-size:11px}
.mini .prog{position:absolute;left:12px;right:12px;bottom:0;height:2px;background:#0001}.mini .prog i{display:block;width:42%;height:2px;background:var(--pri)}
.nav{position:absolute;left:0;right:0;bottom:0;height:80px;background:var(--surf);display:flex;justify-content:space-around;padding-top:12px;box-sizing:border-box}
.nav div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--on2);width:64px}
.nav i{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-style:normal}
.nav .on{color:var(--on)}.nav .on i{background:var(--sec)}
.pill{position:absolute;left:14px;right:14px;bottom:16px;background:#fff;border-radius:30px;box-shadow:0 4px 16px #0003;overflow:hidden}
.pill .mrow{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-bottom:1px solid #0001}
.pill .mrow .art{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7a4fd1,#d14f8a)}
.pill .tabs{display:flex;justify-content:space-around;align-items:center;height:56px;padding:0 6px}
.pill .tabs div{display:flex;align-items:center;gap:6px;color:var(--on2);padding:8px 10px;border-radius:20px;font-size:13px;font-weight:500}
.pill .tabs .on{background:var(--sec);color:var(--on)}
.searchbar{margin:8px 16px 6px;height:52px;border-radius:26px;background:var(--surf2);display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--on2);font-size:15px}
.searchbar .av{margin-left:auto}
.note{position:absolute;background:#FFF3B0;color:#333;font-size:11px;padding:5px 8px;border-radius:6px;box-shadow:0 1px 4px #0002;max-width:160px;line-height:1.3;z-index:5}
.list .it{display:flex;gap:12px;padding:12px 16px;align-items:center;font-size:15px}
.list .it .ms{color:var(--on2)}.list .it small{display:block;color:var(--on2);font-size:12px}
.list .it .n{margin-left:auto;color:var(--on2);font-size:13px}
.sec{font-size:13px;color:var(--pri);font-weight:500;padding:14px 16px 4px}
.reader{padding:6px 20px;font-size:15px;line-height:1.55;color:var(--on2)}
.reader h3{color:var(--on);font-size:22px;line-height:1.25;margin:6px 0 6px}
.listenfab{position:absolute;right:16px;bottom:24px;background:var(--sec);border-radius:16px;height:56px;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:500;box-shadow:0 2px 6px #0003}
</style></head><body>
<h1>Feeder · global navigation (Android)</h1>
<p class="sub">Feeds tab, "By feed" view. Tabs: Feeds · Search · Discover · Playlists · Library. A, B and C are the three options. The two screens on the right apply to all of them.</p>
<div class="row" id="row"></div>
<template id="feeds">
  <div class="status"><span>9:41</span><span>▾ ▴ ■</span></div>
  <div class="top"><span class="t">Feeds</span><span class="ms">more_vert</span></div>
  <div class="seg"><div><span class="ms" style="font-size:18px">view_agenda</span>Latest</div><div class="on"><span class="ms" style="font-size:18px">grid_view</span>By feed</div></div>
  <div class="chips"><span class="chip on">All 24</span><span class="chip"><span class="ms">headphones</span>4</span><span class="chip"><span class="ms">smart_display</span>6</span><span class="chip manage"><span class="ms">tune</span>Manage</span></div>
  <div class="lbl">5 folders · 9 feeds</div>
  <div class="grid">
    <div class="tile" style="background:#2f6f5e"><span class="ms k">folder</span><b>38</b>Tech</div>
    <div class="tile" style="background:#8a4b2a"><span class="ms k">folder</span><b>12</b>News</div>
    <div class="tile" style="background:#3d4f8f"><span class="ms k">headphones</span><b>3</b>Hard Fork</div>
    <div class="tile" style="background:#b03a3a"><span class="ms k">smart_display</span><b>7</b>Veritasium</div>
    <div class="tile" style="background:#5b5b5b"><b>21</b>Ars Technica</div>
    <div class="tile" style="background:#6b3f8a"><span class="ms k">headphones</span><b>2</b>Acquired</div>
    <div class="tile" style="background:#1f5f8b"><b>9</b>The Verge</div>
    <div class="tile" style="background:#7a6a2a"><span class="ms k">folder</span><b>5</b>Design</div>
    <div class="tile" style="background:#2a6a7a"><span class="ms k">smart_display</span><b>4</b>MKBHD</div>
    <div class="tile" style="background:#4a6a3a"><b>1</b>Stratechery</div>
    <div class="tile" style="background:#7a3a5a"><span class="ms k">folder</span><b>6</b>Podcasts</div>
    <div class="tile" style="background:#3a3a6a"><b>14</b>Hacker News</div>
  </div>
</template>
<script>
const T=document.getElementById('feeds').innerHTML,row=document.getElementById('row');
const navItems=[['dynamic_feed','Feeds'],['search','Search'],['explore','Discover'],['queue_music','Playlists'],['video_library','Library']];
const mini=`<div class="art"></div><div class="tx">Hard Fork · Ep. 212<br><small>18 min left</small></div><span class="ms fill">pause</span><span class="ms">close</span><div class="prog"><i></i></div>`;
function nav(on,items=navItems){return `<div class="nav">${items.map(([i,l])=>`<div class="${l==on?'on':''}"><i><span class="ms ${l==on?'fill':''}">${i}</span></i>${l}</div>`).join('')}</div>`}
function col(title,desc,inner){const c=document.createElement('div');c.className='col';c.innerHTML=`<h2>${title}</h2><p>${desc}</p><div class="phone">${inner}</div>`;row.appendChild(c)}
// A
col('A · Standard M3 bottom bar','The default Material 3 bar: always visible, 5 icons, all labeled. The mini player sits just above it. Simplest and most predictable, but it takes the most screen space.',
 T+`<div class="fab" style="bottom:152px"><span class="ms">add</span>Add feed</div><div class="mini" style="bottom:88px">${mini}</div>`+nav('Feeds'));
// B
col('B · Floating bar, hides on scroll','A floating card with the mini player folded into its top row. It slides away as you scroll down and comes back on the first scroll up. Only the active tab shows its label. Gives you the most reading space, but labels are hidden.',
 T.replace('class="t">Feeds','class="t">Feeds')+`<div class="fab" style="bottom:150px"><span class="ms">add</span>Add</div>
 <div class="pill"><div class="mrow"><div class="art"></div><div style="flex:1;font-size:13px">Hard Fork · Ep. 212<br><small style="color:#666">18 min left</small></div><span class="ms fill">pause</span></div>
 <div class="tabs"><div class="on"><span class="ms fill">dynamic_feed</span>Feeds</div><div><span class="ms">search</span></div><div><span class="ms">explore</span></div><div><span class="ms">queue_music</span></div><div><span class="ms">video_library</span></div></div></div>
 <div class="note" style="right:10px;top:250px">Scroll down → bar hides<br>Scroll up → bar returns</div>`);
// C
const navC=[['dynamic_feed','Feeds'],['explore','Discover'],['queue_music','Playlists'],['video_library','Library']];
col('C · Search bar on top + 4 tabs','Search becomes a search bar at the top of every tab instead of a tab of its own, like the Gmail and Google Play apps. One tap and you are typing. The bottom bar then has 4 roomier tabs.',
 `<div class="status"><span>9:41</span><span>▾ ▴ ■</span></div><div class="searchbar"><span class="ms">search</span>Search everything<span class="ms av">more_vert</span></div>`+T.split('<div class="seg">')[1].replace(/^/,'<div class="seg">')+`<div class="fab" style="bottom:152px"><span class="ms">add</span>Add feed</div><div class="mini" style="bottom:88px">${mini}</div>`+nav('Feeds',navC));
// Library
col('Library tab (all options)','Holds the things you have kept: Saved, Highlights and Downloads, with Settings at the bottom. Replaces the drawer for these.',
 `<div class="status"><span>9:41</span><span>▾ ▴ ■</span></div><div class="top"><span class="t">Library</span></div>
 <div class="list">
 <div class="it"><span class="ms">bookmark</span><div>Saved<small>Read later, shared links</small></div><span class="n">17</span></div>
 <div class="it"><span class="ms">ink_highlighter</span><div>Highlights<small>Notes and quotes</small></div><span class="n">42</span></div>
 <div class="it"><span class="ms">download</span><div>Downloads<small>Offline videos and episodes · 1.2 GB</small></div><span class="n">8</span></div>
 <div class="sec">Recently saved</div>
 <div class="it"><span class="ms">article</span><div>The quiet death of the RSS reader<small>Stratechery · 12 min</small></div></div>
 <div class="it"><span class="ms">smart_display</span><div>Why the sky is blue<small>Veritasium · 14 min</small></div></div>
 <div class="it"><span class="ms">headphones</span><div>The Nvidia episode<small>Acquired · 2 h 40 min</small></div></div>
 <div class="sec">App</div>
 <div class="it"><span class="ms">settings</span><div>Settings</div></div>
 <div class="it"><span class="ms">sync</span><div>Sync</div></div>
 </div><div class="mini" style="bottom:88px">${mini}</div>`+nav('Library'));
// Reader
col('Reader (all options)','The bar hides while you read an article, watch a video or use Flip. Back returns to the tab you came from, scrolled to where you were.',
 `<div class="status"><span>9:41</span><span>▾ ▴ ■</span></div><div class="top"><span class="ms">arrow_back</span><span class="t"></span><span class="ms">bookmark</span><span class="ms">share</span><span class="ms">more_vert</span></div>
 <div class="reader"><small>Stratechery · 12 min</small><h3>The quiet death of the RSS reader</h3><p>For a decade the obituaries kept coming, and yet the format refused to die. What changed was not the protocol but the reader…</p><p>Every app that tried to own the feed eventually discovered that people wanted their sources back. The reader is the product…</p><p>Which brings us to podcasts, where RSS quietly won…</p></div>
 <div class="listenfab"><span class="ms">headphones</span>Listen</div><div class="note" style="left:16px;bottom:30px">No bottom bar here</div>`);
</script></body></html>
