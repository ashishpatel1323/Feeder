# Feeder Web (web/): tests and builds on pull requests, and on pushes to master deploys
# to Cloudflare Pages (static app + the /api function in web/functions).
#
# One-time setup: add repository secrets CLOUDFLARE_API_TOKEN (with "Cloudflare Pages: Edit")
# and CLOUDFLARE_ACCOUNT_ID. Without them the deploy step is skipped.
name: Web

on:
  push:
    branches:
      - master
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    if: github.repository != 'spacecowboy/feeder'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4.162.0 pages project create feeder-web --production-branch master || true
          npx --yes wrangler@4.162.0 pages deploy dist --project-name feeder-web --branch master --commit-dirty=true
